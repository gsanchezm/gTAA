# ===========================================================================
# gTAA Update Visual Baselines (manual dispatch only)
# ===========================================================================
# Runs the visual suites with UPDATE_VISUAL_BASELINE=true so the pixelmatch
# baselines are regenerated, then uploads the refreshed baselines as an
# artifact for review / commit. This is intentionally separate from the main
# experiment workflow so baseline updates are a deliberate, manual action.
# ===========================================================================
name: gTAA Update Visual Baselines

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: "Environment whose UI is captured as the new baseline."
        type: choice
        required: false
        default: local
        options:
          - local
          - staging
          - prod

env:
  ARCHITECTURE_TYPE: GTAA_BASELINE
  REPOSITORY_NAME: gTAA
  TARGET_ENVIRONMENT: ${{ github.event.inputs.target_environment || 'local' }}
  # Force baseline update mode for the visual scripts.
  UPDATE_VISUAL_BASELINE: "true"

permissions:
  contents: read

jobs:
  update-baselines:
    name: Update visual baselines
    runs-on: ubuntu-latest
    env:
      TOOL_NAME: pixelmatch
      GTAA_PLATFORM: web
      GTAA_DRIVER: pixelmatch
      GTAA_VISUAL: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup + manifest
        uses: ./.github/actions/setup-and-manifest

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps || pnpm exec playwright install || true

      # The visual executor writes a baseline ONLY when one does not already
      # exist (create-only; it never overwrites, even in update mode). Delete the
      # tree first so UPDATE_VISUAL_BASELINE=true actually RE-creates every
      # snapshot — otherwise the regen is a silent no-op and stale baselines
      # persist. (Every @visual scenario must reach its capture for this to be a
      # complete set; flaky scenarios would leave a baseline missing.)
      - name: Clear existing baselines (force full re-create)
        run: rm -rf visual-baselines && echo "cleared visual-baselines for a full regen"
        shell: bash

      # With UPDATE_VISUAL_BASELINE=true these runs write new baselines. The
      # capture renders the LIVE app, so the AUT must be injected here too —
      # without it the run would hit localhost and produce useless baselines.
      - name: Update visual baselines (desktop)
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: pnpm test:visual:desktop || true

      - name: Update visual baselines (responsive)
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: pnpm test:visual:responsive || true

      # Upload the refreshed baselines so they can be reviewed and committed.
      # The visual oracle persists baselines under visual-baselines/** (see
      # test-adaptation/visual/visual-paths.ts BASELINES_ROOT) — that is the path
      # to return; the earlier speculative globs matched nothing in this repo.
      - name: Upload updated baselines
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gtaa-visual-baselines
          path: |
            visual-baselines/**
            visual-results/**
            metrics/raw/**
            metrics/processed/**
            results/**
          if-no-files-found: warn
          retention-days: 90
