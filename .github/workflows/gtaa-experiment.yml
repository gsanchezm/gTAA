# ===========================================================================
# gTAA Experiment Workflow
# ===========================================================================
# Layered Generic Test Automation Architecture (gTAA) baseline workflow used
# in a paired experiment against a reference repository.
#
# Design goals:
#   * Six fully INDEPENDENT tool jobs (no execution dependency between them).
#   * Each job ALWAYS runs the metrics pipeline and ALWAYS uploads artifacts,
#     even when test execution fails or no live app / device is available.
#   * A final `consolidate` job aggregates every tool's metrics and computes
#     the quality-attribute summary.
#
# Repeated runs (100-run experiment) are supported in three ways:
#   1. Manual single run via the Actions UI (workflow_dispatch).
#   2. External driver loop using the GitHub CLI, e.g.:
#
#        for i in $(seq 1 100); do
#          gh workflow run gtaa-experiment.yml \
#            -f experiment_batch_id="batch-2026-05-28" \
#            -f run_index="$i" \
#            -f target_environment="staging"
#        done
#
#      See docs/experiment-runs.md for the full driver script.
#   3. A matrix example job (`matrix-driver-example`, disabled by default)
#      that fans out N indices in a single dispatch. Enable by setting
#      RUN_MATRIX=true as a repository/workflow variable.
# ===========================================================================
name: gTAA Experiment

on:
  workflow_dispatch:
    inputs:
      experiment_batch_id:
        description: "Identifier grouping all runs of one experiment batch."
        type: string
        required: true
        default: "batch-local"
      run_index:
        description: "Index of this run within the batch (1..N)."
        type: string
        required: true
        default: "1"
      update_visual_baseline:
        description: "Update visual baselines instead of comparing against them."
        type: boolean
        required: false
        default: false
      target_environment:
        description: "Environment under test."
        type: choice
        required: false
        default: local
        options:
          - local
          - staging
          - prod
  # Optional push trigger for CI sanity only. The tool jobs are resilient and
  # will collect metrics even without a live app, so this is safe on main.
  push:
    branches:
      - main

# Top-level environment shared by every job. Inputs flow down via these vars.
env:
  ARCHITECTURE_TYPE: GTAA_BASELINE
  REPOSITORY_NAME: gTAA
  EXPERIMENT_BATCH_ID: ${{ github.event.inputs.experiment_batch_id || 'ci-sanity' }}
  RUN_INDEX: ${{ github.event.inputs.run_index || '1' }}
  TARGET_ENVIRONMENT: ${{ github.event.inputs.target_environment || 'local' }}
  UPDATE_VISUAL_BASELINE: ${{ github.event.inputs.update_visual_baseline || 'false' }}
  # The mobile jobs install the OmniPizza app under test by downloading it from
  # this repo's latest GitHub release (resolved by the resolve-omnipizza-release
  # job), so CI never needs the (untracked) binaries committed. Mirrors the TOM
  # reference so both arms exercise the same published build.
  OMNIPIZZA_RELEASES_REPO: gsanchezm/OmniPizza

# Allow multiple experiment runs to proceed in parallel (do NOT cancel
# in-progress runs; each run_index is a distinct data point).
concurrency:
  group: gtaa-experiment-${{ github.event.inputs.experiment_batch_id || github.run_id }}-${{ github.event.inputs.run_index || github.run_number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------------
  # 0. Resolve the latest OmniPizza release (mobile app source)
  # Queries GitHub's /releases/latest for the OmniPizza repo and exposes the tag
  # + download base URL as outputs. The appium-ios / appium-android jobs consume
  # these via needs.resolve-omnipizza-release.outputs.* so the app under test is
  # always the latest published build — no committed binaries, no per-release edit.
  # -------------------------------------------------------------------------
  resolve-omnipizza-release:
    name: Resolve — OmniPizza latest release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.fetch.outputs.tag }}
      base_url: ${{ steps.fetch.outputs.base_url }}
    steps:
      - name: Fetch latest release tag
        id: fetch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${OMNIPIZZA_RELEASES_REPO}/releases/latest" \
            | jq -r .tag_name)
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "Failed to resolve latest OmniPizza release tag."
            exit 1
          fi
          BASE_URL="https://github.com/${OMNIPIZZA_RELEASES_REPO}/releases/download/${TAG}"
          echo "Resolved OmniPizza release: $TAG"
          echo "Download base URL: $BASE_URL"
          echo "tag=$TAG"           >> "$GITHUB_OUTPUT"
          echo "base_url=$BASE_URL" >> "$GITHUB_OUTPUT"

  # -------------------------------------------------------------------------
  # 1a. Playwright web — Desktop. Split from Responsive (and chained into the
  # visual jobs) so the pipeline graph mirrors the TOM reference's DAG.
  # -------------------------------------------------------------------------
  playwright-desktop:
    name: Playwright — Desktop
    runs-on: ubuntu-latest
    env:
      TOOL_NAME: playwright-desktop
      GTAA_PLATFORM: web
      GTAA_DRIVER: playwright
      # The suites run against the live OmniPizza app; without these the executor
      # falls back to localhost and every navigate/login fails (a green job via
      # `|| true` but 0 passing scenarios). Wired from repo secrets, like TOM.
      BASE_URL: ${{ secrets.BASE_URL }}
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup + manifest
        uses: ./.github/actions/setup-and-manifest
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps || pnpm exec playwright install || true
      - name: Run web tests (desktop)
        run: pnpm test:web:desktop
      - name: Collect + normalize metrics
        if: always()
        run: pnpm metrics:all
      - name: Upload metrics artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gtaa-metrics-playwright-desktop
          path: |
            metrics/raw/**
            metrics/processed/**
            results/**
          if-no-files-found: warn
          retention-days: 30

  # -------------------------------------------------------------------------
  # 1b. Playwright web — Responsive
  # -------------------------------------------------------------------------
  playwright-responsive:
    name: Playwright — Responsive
    runs-on: ubuntu-latest
    env:
      TOOL_NAME: playwright-responsive
      GTAA_PLATFORM: web
      GTAA_DRIVER: playwright
      BASE_URL: ${{ secrets.BASE_URL }}
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup + manifest
        uses: ./.github/actions/setup-and-manifest
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps || pnpm exec playwright install || true
      - name: Run web tests (responsive)
        run: pnpm test:web:responsive
      - name: Collect + normalize metrics
        if: always()
        run: pnpm metrics:all
      - name: Upload metrics artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gtaa-metrics-playwright-responsive
          path: |
            metrics/raw/**
            metrics/processed/**
            results/**
          if-no-files-found: warn
          retention-days: 30

  # -------------------------------------------------------------------------
  # 2. Appium iOS (simulator / real device)
  # -------------------------------------------------------------------------
  appium-ios:
    name: Appium iOS
    # macOS runner is required for iOS simulators. The experiment may instead
    # target self-hosted / real devices; in that case swap runs-on for a
    # self-hosted label (e.g. [self-hosted, macos, ios]).
    runs-on: macos-14
    # Bound a hung run while leaving room for a HEALTHY 88-scenario XCUITest
    # suite. Run 28313147720 hit the 150-min cap mid-suite (XCUITest is very
    # slow), so allow 180 min to let it actually complete and emit telemetry,
    # still well short of the 6h default that would block `consolidate`. Caps
    # wasted wall-clock only — no test-behaviour change.
    timeout-minutes: 180
    needs: [resolve-omnipizza-release, playwright-responsive]
    if: always()
    env:
      TOOL_NAME: appium-ios
      GTAA_PLATFORM: ios
      GTAA_DRIVER: appium
      # The gTAA mobile suite's API helpers (auth token capture, catalog id lookup
      # for the builder) call the live backend; wire it from the repo secret.
      BASE_URL: ${{ secrets.BASE_URL }}
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup + manifest
        uses: ./.github/actions/setup-and-manifest

      # ---- Install the OmniPizza app from the latest release ---------------
      - name: Download iOS simulator app
        env:
          OMNIPIZZA_RELEASE_BASE_URL: ${{ needs.resolve-omnipizza-release.outputs.base_url }}
          OMNIPIZZA_RELEASE_TAG: ${{ needs.resolve-omnipizza-release.outputs.tag }}
        run: |
          mkdir -p assets/apps/ios
          echo "Downloading OmniPizza iOS simulator bundle from release ${OMNIPIZZA_RELEASE_TAG}"
          curl -fL "$OMNIPIZZA_RELEASE_BASE_URL/OmniPizza-Simulator.zip" \
            -o assets/apps/ios/OmniPizza-Simulator.zip
          ls -lh assets/apps/ios/OmniPizza-Simulator.zip
        shell: bash

      - name: Unpack iOS simulator app
        run: |
          rm -rf assets/apps/ios/unpacked
          mkdir -p assets/apps/ios/unpacked
          unzip -q assets/apps/ios/OmniPizza-Simulator.zip -d assets/apps/ios/unpacked
          IOS_APP_PATH=$(find assets/apps/ios/unpacked -maxdepth 3 -name '*.app' -type d | head -n 1)
          if [ -z "$IOS_APP_PATH" ]; then
            echo "No .app bundle found inside OmniPizza-Simulator.zip"; exit 1
          fi
          echo "IOS_APP_PATH=$IOS_APP_PATH" >> "$GITHUB_ENV"
          echo "Resolved IOS_APP_PATH=$IOS_APP_PATH"
        shell: bash

      # ---- Pin a modern Xcode + pre-warm the host toolchain ----------------
      # The macos-14 image's DEFAULT-selected Xcode drifted to 15.4 (2024) while
      # its iOS simulator runtimes are 18.x. Under the stale default,
      # appium-xcuitest's `xcrun --sdk iphonesimulator --show-sdk-version` probe
      # (hard 15s cap, SIGKILLed on timeout) never finishes priming the cold SDK
      # metadata cache, so every XCUITest session dies with "Could not determine
      # iOS SDK version" and ZERO sessions start. Select the newest installed
      # Xcode 16.x and prime that exact query once (un-capped, bounded retry) so
      # later Appium sessions reuse the warm cache. Pure host provisioning — no
      # test-layer change; moves gTAA toward the toolchain a healthy run had.
      - name: Select + warm Xcode toolchain
        run: |
          XC=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "${XC:-/Applications/Xcode.app}"
          xcodebuild -version
          sudo xcodebuild -runFirstLaunch || true
          for i in $(seq 1 6); do
            if timeout 60 xcrun --sdk iphonesimulator --show-sdk-version; then
              echo "iphonesimulator SDK query is warm"; break
            fi
            echo "SDK query still slow (attempt $i) — retrying"; sleep 3
          done
        shell: bash

      # ---- iOS simulator setup ---------------------------------------------
      # Select an available iPhone simulator, export its name so the executor
      # (appium:deviceName = IOS_DEVICE_NAME) targets exactly it, then boot it so
      # Appium/WebDriverAgent have a ready target.
      - name: Boot iOS simulator
        run: |
          xcrun simctl list devices available || true
          DEVICE_LINE=$(xcrun simctl list devices available | grep -E 'iPhone .*\([A-F0-9-]+\) \((Shutdown|Booted)\)' | head -n 1)
          if [ -z "$DEVICE_LINE" ]; then
            echo "No available iPhone simulator found"; exit 1
          fi
          IOS_DEVICE_NAME=$(echo "$DEVICE_LINE" | sed -E 's/^[[:space:]]*([^()]+)[[:space:]]+\(.*/\1/' | xargs)
          IOS_UDID=$(echo "$DEVICE_LINE" | sed -E 's/.*\(([A-F0-9-]+)\).*/\1/')
          echo "IOS_DEVICE_NAME=$IOS_DEVICE_NAME" >> "$GITHUB_ENV"
          echo "Selected simulator: $IOS_DEVICE_NAME ($IOS_UDID)"
          xcrun simctl boot "$IOS_UDID" || true
          # Block until first-boot Data Migration completes before Appium starts
          # (no `|| true` — surface a real boot failure; parity with TOM).
          xcrun simctl bootstatus "$IOS_UDID" -b
        shell: bash

      # Start Appium and run the suite in the SAME step so the background server
      # stays alive for the test process. The project-local binary must be launched
      # via `pnpm exec appium` (bare `appium` is not on the runner PATH — a prior
      # `(appium &)` launched nothing, so every session got ECONNREFUSED at :4723).
      # --base-path / matches the executor's connection path.
      - name: Run iOS tests
        run: |
          mkdir -p results
          # Stable derived-data path so WebDriverAgent is built ONCE (by the warm-up
          # below) and reused across the per-scenario sessions. Set here, not in the
          # job env, because the `runner` context is not available at job-env level.
          export IOS_WDA_DERIVED_DATA_PATH="$RUNNER_TEMP/gtaa-wda"
          # Warm the Render backend so its cold-start latency doesn't push the
          # first scenarios' element waits past the timeout.
          for i in 1 2 3 4 5; do curl -fsS -m 30 "$API_BASE_URL" >/dev/null 2>&1 && break; sleep 2; done
          pnpm exec appium --base-path / > results/appium-ios-server.log 2>&1 &
          APPIUM_PID=$!
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:4723/status >/dev/null 2>&1 && { echo "Appium ready"; break; }
            sleep 1
          done
          # Build WebDriverAgent once, outside cucumber's 120s per-step budget, so
          # the first scenario reuses it instead of timing out on the cold build.
          node scripts/ci/warm-wda.mjs || true
          # Run the suite WITHOUT `|| true` so the job's red/green reflects the real
          # result (no false positives). Capture its exit code, stop Appium, then
          # exit with it. Metrics/upload still run via their `if: always()` steps.
          set +e
          pnpm test:ios
          TEST_EXIT=$?
          kill "$APPIUM_PID" 2>/dev/null || true
          exit $TEST_EXIT
        shell: bash

      - name: Collect + normalize metrics
        if: always()
        run: pnpm metrics:all

      - name: Upload metrics artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gtaa-metrics-appium-ios
          path: |
            metrics/raw/**
            metrics/processed/**
            results/**
          if-no-files-found: warn
          retention-days: 30

  # -------------------------------------------------------------------------
  # 3. Appium Android (emulator / real device)
  # -------------------------------------------------------------------------
  appium-android:
    name: Appium Android
    # Hardware acceleration for the Android emulator runner is available on
    # ubuntu-latest GitHub-hosted runners. Swap for a self-hosted label to run
    # against a real-device lab (e.g. [self-hosted, android]).
    runs-on: ubuntu-latest
    # Bound a hung run while leaving room for a HEALTHY 88-scenario UiAutomator2
    # suite (empirically ~95 min incl. docker-emulator boot). 150 min fits that
    # with margin yet still caps a genuinely stuck emulator/app-launch well short
    # of the 6h default (which would block `consolidate`). Caps wasted wall-clock
    # only — no test-behaviour change.
    timeout-minutes: 150
    needs: [resolve-omnipizza-release, playwright-responsive]
    if: always()
    env:
      TOOL_NAME: appium-android
      GTAA_PLATFORM: android
      GTAA_DRIVER: appium
      # The gTAA mobile suite's API helpers call the live backend; wire from secret.
      BASE_URL: ${{ secrets.BASE_URL }}
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM (Android emulator acceleration)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules || true
          sudo udevadm trigger --name-match=kvm || true
        shell: bash

      - name: Install Android platform tools (adb)
        run: |
          sudo apt-get update
          sudo apt-get install -y android-sdk-platform-tools
          adb version
        shell: bash

      - name: Setup + manifest
        uses: ./.github/actions/setup-and-manifest

      # ---- Install the OmniPizza app from the latest release ---------------
      - name: Download Android app (APK) from release
        env:
          OMNIPIZZA_RELEASE_BASE_URL: ${{ needs.resolve-omnipizza-release.outputs.base_url }}
          OMNIPIZZA_RELEASE_TAG: ${{ needs.resolve-omnipizza-release.outputs.tag }}
        run: |
          mkdir -p assets/apps/android
          echo "Downloading OmniPizza Android APK from release ${OMNIPIZZA_RELEASE_TAG}"
          curl -fL "$OMNIPIZZA_RELEASE_BASE_URL/omnipizza-release.apk" \
            -o assets/apps/android/app-release.apk
          ls -lh assets/apps/android/app-release.apk
          echo "ANDROID_APP_PATH=assets/apps/android/app-release.apk" >> "$GITHUB_ENV"
        shell: bash

      # ---- Boot a Dockerized Android emulator (mirrors the TOM reference) -----
      # halimqarroum/docker-android runs the emulator in a privileged KVM
      # container; host adb connects to it on localhost:5555. This is far more
      # reliable on GitHub-hosted runners than the in-VM emulator action (which
      # failed to boot here). Best-effort so the metrics stage stays reachable.
      - name: Start Android emulator (docker-android)
        continue-on-error: true
        run: |
          docker run -d \
            --name android-emulator \
            --privileged \
            --device /dev/kvm \
            -p 5554:5554 -p 5555:5555 \
            -e API_LEVEL=33 \
            -e IMG_TYPE=google_apis \
            -e ARCHITECTURE=x86_64 \
            -e DEVICE_ID=pixel \
            -e MEMORY=4096 -e CORES=2 \
            -e DISABLE_ANIMATION=true -e DISABLE_HIDDEN_POLICY=true -e SKIP_AUTH=1 \
            halimqarroum/docker-android:api-33
        shell: bash

      - name: Wait for emulator to be ready
        continue-on-error: true
        run: |
          adb connect localhost:5555 || true
          for i in $(seq 1 40); do
            if adb -s localhost:5555 shell getprop sys.boot_completed 2>/dev/null | grep -q "1"; then
              echo "Emulator ready after $((i * 15))s"
              break
            fi
            echo "  Attempt $i/40 — waiting 15s..."
            sleep 15
          done
          adb devices
        shell: bash

      # ---- Suppress emulator SYSTEM error/ANR dialogs ----------------------
      # Under load the docker emulator's SystemUI process can ANR and pop a modal
      # ("System UI isn't responding") that overlays the AUT, occluding the login
      # field ~input-username so every scenario times out (0/88). This is an
      # emulator/OS artifact independent of the architecture — the app itself
      # renders correctly. hide_error_dialogs stops the OS from drawing that modal
      # (same category as the DISABLE_ANIMATION/DISABLE_HIDDEN_POLICY emulator
      # flags above); it cannot mask a genuine app failure (which shows a
      # different signature). CI-env confound removal — see threats-to-validity.md.
      - name: Suppress emulator system error/ANR dialogs
        continue-on-error: true
        run: |
          adb -s localhost:5555 wait-for-device || true
          adb -s localhost:5555 shell settings put global hide_error_dialogs 1 || true
          echo "hide_error_dialogs=$(adb -s localhost:5555 shell settings get global hide_error_dialogs)"
        shell: bash

      # Start Appium and run the suite in the SAME step (project-local
      # `pnpm exec appium`; the background server must outlive its starting shell).
      - name: Run Android tests
        run: |
          mkdir -p results
          for i in 1 2 3 4 5; do curl -fsS -m 30 "$API_BASE_URL" >/dev/null 2>&1 && break; sleep 2; done
          pnpm exec appium --base-path / > results/appium-android-server.log 2>&1 &
          APPIUM_PID=$!
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:4723/status >/dev/null 2>&1 && { echo "Appium ready"; break; }
            sleep 1
          done
          # No `|| true`: the job's red/green reflects the real result. Capture the
          # exit code, stop Appium, exit with it; metrics/upload run via if: always().
          set +e
          pnpm test:android
          TEST_EXIT=$?
          kill "$APPIUM_PID" 2>/dev/null || true
          exit $TEST_EXIT
        shell: bash

      - name: Collect + normalize metrics
        if: always()
        run: pnpm metrics:all

      - name: Upload metrics artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gtaa-metrics-appium-android
          path: |
            metrics/raw/**
            metrics/processed/**
            results/**
          if-no-files-found: warn
          retention-days: 30

  # -------------------------------------------------------------------------
  # 4. API tests
  # -------------------------------------------------------------------------
  api:
    name: API
    runs-on: ubuntu-latest
    env:
      TOOL_NAME: api
      GTAA_PLATFORM: api
      GTAA_DRIVER: api
      # ApiExecutor hits the live backend; without it every endpoint call fails.
      BASE_URL: ${{ secrets.BASE_URL }}
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup + manifest
        uses: ./.github/actions/setup-and-manifest

      # Example of injecting secrets without plaintext. Uncomment and map to
      # your real test backend. Secrets are never echoed.
      # env:
      #   API_BASE_URL: ${{ secrets.API_BASE_URL }}
      #   API_TOKEN: ${{ secrets.API_TOKEN }}
      - name: Run API tests
        run: pnpm test:api

      - name: Collect + normalize metrics
        if: always()
        run: pnpm metrics:all

      - name: Upload metrics artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gtaa-metrics-api
          path: |
            metrics/raw/**
            metrics/processed/**
            results/**
          if-no-files-found: warn
          retention-days: 30

  # -------------------------------------------------------------------------
  # 5. Gatling-style performance (smoke/load/stress)
  # -------------------------------------------------------------------------
  gatling:
    name: Performance
    runs-on: ubuntu-latest
    env:
      TOOL_NAME: gatling
      GTAA_PLATFORM: perf
      GTAA_DRIVER: gatling
      # Gatling load sims target the live backend.
      BASE_URL: ${{ secrets.BASE_URL }}
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup + manifest
        uses: ./.github/actions/setup-and-manifest

      # Run the smoke profile by default (cheap CI signal). Switch to
      # perf:load / perf:stress for heavier experiment runs.
      - name: Run performance smoke
        run: pnpm perf:smoke || true

      - name: Collect + normalize metrics
        if: always()
        run: pnpm metrics:all

      - name: Upload metrics artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gtaa-metrics-gatling
          path: |
            metrics/raw/**
            metrics/processed/**
            results/**
          if-no-files-found: warn
          retention-days: 30

  # -------------------------------------------------------------------------
  # 6a. Pixelmatch visual — Desktop. Chained after Playwright Desktop so the
  # graph flows Playwright -> Pixelmatch -> Consolidate, mirroring TOM.
  # -------------------------------------------------------------------------
  pixelmatch-desktop:
    name: Pixelmatch — Desktop
    runs-on: ubuntu-latest
    needs: playwright-desktop
    # needs is for DAG ORDERING (the TOM-like graph) only; always() so a flaky
    # upstream job never skips this independent measurement.
    if: always()
    env:
      TOOL_NAME: pixelmatch-desktop
      GTAA_PLATFORM: web
      GTAA_DRIVER: pixelmatch
      BASE_URL: ${{ secrets.BASE_URL }}
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      GTAA_VISUAL: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup + manifest
        uses: ./.github/actions/setup-and-manifest
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps || pnpm exec playwright install || true
      - name: Run visual tests (desktop)
        run: pnpm test:visual:desktop
      - name: Collect + normalize metrics
        if: always()
        run: pnpm metrics:all
      # Gate the job on visual drift (the oracle records but does not fail the
      # scenario on drift) — mirrors TOM's visual gate so both arms apply the same
      # pass/fail policy. Runs even if a prior step failed so drift is always shown.
      - name: Visual gate — fail the job if any snapshot drifted
        if: success() || failure()
        run: pnpm exec tsx scripts/metrics/visual-gate.ts
      - name: Upload metrics artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gtaa-metrics-pixelmatch-desktop
          path: |
            metrics/raw/**
            metrics/processed/**
            results/**
          if-no-files-found: warn
          retention-days: 30

  # -------------------------------------------------------------------------
  # 6b. Pixelmatch visual — Responsive (chained after Pixelmatch Desktop)
  # -------------------------------------------------------------------------
  pixelmatch-responsive:
    name: Pixelmatch — Responsive
    runs-on: ubuntu-latest
    needs: pixelmatch-desktop
    if: always()
    env:
      TOOL_NAME: pixelmatch-responsive
      GTAA_PLATFORM: web
      GTAA_DRIVER: pixelmatch
      BASE_URL: ${{ secrets.BASE_URL }}
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      GTAA_VISUAL: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup + manifest
        uses: ./.github/actions/setup-and-manifest
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps || pnpm exec playwright install || true
      - name: Run visual tests (responsive)
        run: pnpm test:visual:responsive
      - name: Collect + normalize metrics
        if: always()
        run: pnpm metrics:all
      - name: Visual gate — fail the job if any snapshot drifted
        if: success() || failure()
        run: pnpm exec tsx scripts/metrics/visual-gate.ts
      - name: Upload metrics artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gtaa-metrics-pixelmatch-responsive
          path: |
            metrics/raw/**
            metrics/processed/**
            results/**
          if-no-files-found: warn
          retention-days: 30

  # -------------------------------------------------------------------------
  # Consolidation: aggregate every tool's metrics + quality-attribute summary
  # -------------------------------------------------------------------------
  consolidate:
    name: Consolidate metrics
    runs-on: ubuntu-latest
    needs:
      - playwright-desktop
      - playwright-responsive
      - pixelmatch-desktop
      - pixelmatch-responsive
      - appium-ios
      - appium-android
      - api
      - gatling
    if: always()
    env:
      TOOL_NAME: consolidate
      # Labels for the consolidation manifest (keeps platform/driver explicit
      # rather than defaulting to "unknown").
      GTAA_PLATFORM: all
      GTAA_DRIVER: all
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup + manifest
        uses: ./.github/actions/setup-and-manifest

      # Pull every per-tool artifact back into metrics/ so the aggregation
      # scripts see the full dataset. All gtaa-metrics-* artifacts are merged.
      - name: Download all tool artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: gtaa-metrics-*
          path: metrics/incoming
          merge-multiple: true

      # Re-hydrate raw/processed dirs from the downloaded artifacts so the
      # aggregation scripts find them in their expected locations.
      - name: Stage downloaded metrics
        run: |
          mkdir -p metrics/raw metrics/processed results
          if [ -d metrics/incoming/metrics/raw ]; then cp -r metrics/incoming/metrics/raw/. metrics/raw/ || true; fi
          if [ -d metrics/incoming/metrics/processed ]; then cp -r metrics/incoming/metrics/processed/. metrics/processed/ || true; fi
          if [ -d metrics/incoming/results ]; then cp -r metrics/incoming/results/. results/ || true; fi
        shell: bash

      - name: Aggregate metrics
        if: always()
        run: pnpm metrics:all

      - name: Compute quality-attribute summary
        if: always()
        run: pnpm metrics:quality:all

      - name: Upload consolidated artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gtaa-metrics-consolidated
          path: |
            metrics/raw/**
            metrics/processed/**
            results/**
          if-no-files-found: warn
          retention-days: 90

  # -------------------------------------------------------------------------
  # OPTIONAL matrix driver example (disabled by default).
  # -------------------------------------------------------------------------
  # This job demonstrates fanning out multiple run indices from a single
  # dispatch. It is gated behind the RUN_MATRIX variable so the primary
  # workflow stays manual-dispatch friendly. To enable, define a workflow /
  # repository variable RUN_MATRIX=true. For a true 100-run experiment prefer
  # the external `gh workflow run` loop documented at the top of this file,
  # which yields one independent workflow run (and dataset) per index.
  matrix-driver-example:
    name: Matrix driver (example)
    if: vars.RUN_MATRIX == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        run_index: [1, 2, 3, 4, 5]
    steps:
      - name: Echo run index
        run: |
          echo "Would dispatch experiment run_index=${{ matrix.run_index }}"
          echo "batch=${EXPERIMENT_BATCH_ID} env=${TARGET_ENVIRONMENT}"
        shell: bash
