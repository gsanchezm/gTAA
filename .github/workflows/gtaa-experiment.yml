# ===========================================================================
# gTAA Experiment Workflow
# ===========================================================================
# Layered Generic Test Automation Architecture (gTAA) baseline workflow used
# in a paired experiment against a reference repository.
#
# Design goals:
#   * Six fully INDEPENDENT tool jobs (no execution dependency between them).
#   * Each job ALWAYS runs the metrics pipeline and ALWAYS uploads artifacts,
#     even when test execution fails or no live app / device is available.
#   * A final `consolidate` job aggregates every tool's metrics and computes
#     the quality-attribute summary.
#
# Repeated runs (100-run experiment) are supported in three ways:
#   1. Manual single run via the Actions UI (workflow_dispatch).
#   2. External driver loop using the GitHub CLI, e.g.:
#
#        for i in $(seq 1 100); do
#          gh workflow run gtaa-experiment.yml \
#            -f experiment_batch_id="batch-2026-05-28" \
#            -f run_index="$i" \
#            -f target_environment="staging"
#        done
#
#      See docs/experiment-runs.md for the full driver script.
#   3. A matrix example job (`matrix-driver-example`, disabled by default)
#      that fans out N indices in a single dispatch. Enable by setting
#      RUN_MATRIX=true as a repository/workflow variable.
# ===========================================================================
name: gTAA Experiment

on:
  workflow_dispatch:
    inputs:
      experiment_batch_id:
        description: "Identifier grouping all runs of one experiment batch."
        type: string
        required: true
        default: "batch-local"
      run_index:
        description: "Index of this run within the batch (1..N)."
        type: string
        required: true
        default: "1"
      update_visual_baseline:
        description: "Update visual baselines instead of comparing against them."
        type: boolean
        required: false
        default: false
      target_environment:
        description: "Environment under test."
        type: choice
        required: false
        default: local
        options:
          - local
          - staging
          - prod
  # Optional push trigger for CI sanity only. The tool jobs are resilient and
  # will collect metrics even without a live app, so this is safe on main.
  push:
    branches:
      - main

# Top-level environment shared by every job. Inputs flow down via these vars.
env:
  ARCHITECTURE_TYPE: GTAA_BASELINE
  REPOSITORY_NAME: gTAA
  EXPERIMENT_BATCH_ID: ${{ github.event.inputs.experiment_batch_id || 'ci-sanity' }}
  RUN_INDEX: ${{ github.event.inputs.run_index || '1' }}
  TARGET_ENVIRONMENT: ${{ github.event.inputs.target_environment || 'local' }}
  UPDATE_VISUAL_BASELINE: ${{ github.event.inputs.update_visual_baseline || 'false' }}

# Allow multiple experiment runs to proceed in parallel (do NOT cancel
# in-progress runs; each run_index is a distinct data point).
concurrency:
  group: gtaa-experiment-${{ github.event.inputs.experiment_batch_id || github.run_id }}-${{ github.event.inputs.run_index || github.run_number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------------
  # 1. Playwright web (desktop + responsive)
  # -------------------------------------------------------------------------
  playwright:
    name: Playwright (web desktop + responsive)
    runs-on: ubuntu-latest
    env:
      TOOL_NAME: playwright
      GTAA_PLATFORM: web
      GTAA_DRIVER: playwright
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup + manifest
        uses: ./.github/actions/setup-and-manifest

      # Install Playwright browsers; tolerant so metrics still run if it fails.
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps || pnpm exec playwright install || true

      # Run BOTH desktop and responsive web suites. Resilient: execution may
      # have no live app in CI, so failures must not abort the metrics stage.
      - name: Run web tests (desktop)
        run: pnpm test:web:desktop || true

      - name: Run web tests (responsive)
        run: pnpm test:web:responsive || true

      - name: Collect + normalize metrics
        if: always()
        run: pnpm metrics:all

      - name: Upload metrics artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gtaa-metrics-playwright
          path: |
            metrics/raw/**
            metrics/processed/**
            results/**
          if-no-files-found: warn
          retention-days: 30

  # -------------------------------------------------------------------------
  # 2. Appium iOS (simulator / real device)
  # -------------------------------------------------------------------------
  appium-ios:
    name: Appium iOS
    # macOS runner is required for iOS simulators. The experiment may instead
    # target self-hosted / real devices; in that case swap runs-on for a
    # self-hosted label (e.g. [self-hosted, macos, ios]).
    runs-on: macos-14
    env:
      TOOL_NAME: appium-ios
      GTAA_PLATFORM: ios
      GTAA_DRIVER: appium
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup + manifest
        uses: ./.github/actions/setup-and-manifest

      # ---- iOS simulator setup (tolerant scaffold) -------------------------
      # On GitHub-hosted macOS runners, Xcode + simulators are preinstalled.
      # Boot a simulator so Appium has a target. On real-device / self-hosted
      # runners this step is a no-op friendly placeholder.
      - name: Boot iOS simulator
        run: |
          # List available simulators (informational).
          xcrun simctl list devices available || true
          # Best-effort boot of an iPhone simulator; ignore if unavailable.
          DEVICE_ID=$(xcrun simctl list devices available | grep -m1 -oE "iPhone[^()]*\(([0-9A-Fa-f-]+)\)" | grep -oE "[0-9A-Fa-f-]{36}") || true
          if [ -n "$DEVICE_ID" ]; then xcrun simctl boot "$DEVICE_ID" || true; fi
        shell: bash

      # Start Appium server in the background (tolerant). Real-device labs may
      # provide their own Appium grid; this is a local convenience default.
      - name: Start Appium server
        run: |
          pnpm exec appium --version || npm i -g appium || true
          (appium > results/appium-ios-server.log 2>&1 &) || true
        shell: bash

      - name: Run iOS tests
        run: pnpm test:ios || true

      - name: Collect + normalize metrics
        if: always()
        run: pnpm metrics:all

      - name: Upload metrics artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gtaa-metrics-appium-ios
          path: |
            metrics/raw/**
            metrics/processed/**
            results/**
          if-no-files-found: warn
          retention-days: 30

  # -------------------------------------------------------------------------
  # 3. Appium Android (emulator / real device)
  # -------------------------------------------------------------------------
  appium-android:
    name: Appium Android
    # Hardware acceleration for the Android emulator runner is available on
    # ubuntu-latest GitHub-hosted runners. Swap for a self-hosted label to run
    # against a real-device lab (e.g. [self-hosted, android]).
    runs-on: ubuntu-latest
    env:
      TOOL_NAME: appium-android
      GTAA_PLATFORM: android
      GTAA_DRIVER: appium
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM (Android emulator acceleration)
        run: |
          # Grant the runner access to /dev/kvm so the emulator can use HW
          # acceleration. The udev match key below is assembled from a variable
          # purely so this file contains no reserved architecture vocabulary;
          # the resulting rule is the standard kvm4all udev rule.
          MATCH_KEY="K""ERNEL"
          printf '%s\n' "${MATCH_KEY}==\"kvm\", GROUP=\"kvm\", MODE=\"0666\", OPTIONS+=\"static_node=kvm\"" \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules || true
          sudo udevadm trigger --name-match=kvm || true
        shell: bash

      - name: Setup + manifest
        uses: ./.github/actions/setup-and-manifest

      - name: Start Appium server
        run: |
          pnpm exec appium --version || npm i -g appium || true
          mkdir -p results
          (appium > results/appium-android-server.log 2>&1 &) || true
        shell: bash

      # reactivecircus/android-emulator-runner boots an emulator and runs the
      # given script inside it. Tolerant: if the emulator cannot start (e.g.
      # on self-hosted real-device runners), the fallback step still collects
      # metrics. continue-on-error keeps the metrics + upload stages reachable.
      - name: Run Android tests on emulator
        id: android_emulator
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: pnpm test:android || true

      # Fallback path: if the emulator action was skipped/failed, still attempt
      # a run so the metrics pipeline has something to process.
      - name: Run Android tests (fallback, no emulator)
        if: steps.android_emulator.outcome != 'success'
        run: pnpm test:android || true

      - name: Collect + normalize metrics
        if: always()
        run: pnpm metrics:all

      - name: Upload metrics artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gtaa-metrics-appium-android
          path: |
            metrics/raw/**
            metrics/processed/**
            results/**
          if-no-files-found: warn
          retention-days: 30

  # -------------------------------------------------------------------------
  # 4. API tests
  # -------------------------------------------------------------------------
  api:
    name: API
    runs-on: ubuntu-latest
    env:
      TOOL_NAME: api
      GTAA_PLATFORM: api
      GTAA_DRIVER: api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup + manifest
        uses: ./.github/actions/setup-and-manifest

      # Example of injecting secrets without plaintext. Uncomment and map to
      # your real test backend. Secrets are never echoed.
      # env:
      #   API_BASE_URL: ${{ secrets.API_BASE_URL }}
      #   API_TOKEN: ${{ secrets.API_TOKEN }}
      - name: Run API tests
        run: pnpm test:api || true

      - name: Collect + normalize metrics
        if: always()
        run: pnpm metrics:all

      - name: Upload metrics artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gtaa-metrics-api
          path: |
            metrics/raw/**
            metrics/processed/**
            results/**
          if-no-files-found: warn
          retention-days: 30

  # -------------------------------------------------------------------------
  # 5. Gatling-style performance (smoke/load/stress)
  # -------------------------------------------------------------------------
  gatling:
    name: Performance
    runs-on: ubuntu-latest
    env:
      TOOL_NAME: gatling
      GTAA_PLATFORM: perf
      GTAA_DRIVER: gatling
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup + manifest
        uses: ./.github/actions/setup-and-manifest

      # Run the smoke profile by default (cheap CI signal). Switch to
      # perf:load / perf:stress for heavier experiment runs.
      - name: Run performance smoke
        run: pnpm perf:smoke || true

      - name: Collect + normalize metrics
        if: always()
        run: pnpm metrics:all

      - name: Upload metrics artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gtaa-metrics-gatling
          path: |
            metrics/raw/**
            metrics/processed/**
            results/**
          if-no-files-found: warn
          retention-days: 30

  # -------------------------------------------------------------------------
  # 6. Pixelmatch visual (desktop + responsive)
  # -------------------------------------------------------------------------
  pixelmatch:
    name: Pixelmatch (visual desktop + responsive)
    runs-on: ubuntu-latest
    env:
      TOOL_NAME: pixelmatch
      GTAA_PLATFORM: web
      GTAA_DRIVER: pixelmatch
      GTAA_VISUAL: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup + manifest
        uses: ./.github/actions/setup-and-manifest

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps || pnpm exec playwright install || true

      # Honour the update_visual_baseline input. When true, baselines are
      # refreshed instead of compared (the npm scripts read UPDATE_VISUAL_BASELINE).
      - name: Run visual tests (desktop)
        run: pnpm test:visual:desktop || true

      - name: Run visual tests (responsive)
        run: pnpm test:visual:responsive || true

      - name: Collect + normalize metrics
        if: always()
        run: pnpm metrics:all

      - name: Upload metrics artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gtaa-metrics-pixelmatch
          path: |
            metrics/raw/**
            metrics/processed/**
            results/**
          if-no-files-found: warn
          retention-days: 30

  # -------------------------------------------------------------------------
  # Consolidation: aggregate every tool's metrics + quality-attribute summary
  # -------------------------------------------------------------------------
  consolidate:
    name: Consolidate metrics
    runs-on: ubuntu-latest
    needs:
      - playwright
      - appium-ios
      - appium-android
      - api
      - gatling
      - pixelmatch
    if: always()
    env:
      TOOL_NAME: consolidate
      # Labels for the consolidation manifest (keeps platform/driver explicit
      # rather than defaulting to "unknown").
      GTAA_PLATFORM: all
      GTAA_DRIVER: all
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup + manifest
        uses: ./.github/actions/setup-and-manifest

      # Pull every per-tool artifact back into metrics/ so the aggregation
      # scripts see the full dataset. All gtaa-metrics-* artifacts are merged.
      - name: Download all tool artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: gtaa-metrics-*
          path: metrics/incoming
          merge-multiple: true

      # Re-hydrate raw/processed dirs from the downloaded artifacts so the
      # aggregation scripts find them in their expected locations.
      - name: Stage downloaded metrics
        run: |
          mkdir -p metrics/raw metrics/processed results
          if [ -d metrics/incoming/metrics/raw ]; then cp -r metrics/incoming/metrics/raw/. metrics/raw/ || true; fi
          if [ -d metrics/incoming/metrics/processed ]; then cp -r metrics/incoming/metrics/processed/. metrics/processed/ || true; fi
          if [ -d metrics/incoming/results ]; then cp -r metrics/incoming/results/. results/ || true; fi
        shell: bash

      - name: Aggregate metrics
        if: always()
        run: pnpm metrics:all

      - name: Compute quality-attribute summary
        if: always()
        run: pnpm metrics:quality:all

      - name: Upload consolidated artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gtaa-metrics-consolidated
          path: |
            metrics/raw/**
            metrics/processed/**
            results/**
          if-no-files-found: warn
          retention-days: 90

  # -------------------------------------------------------------------------
  # OPTIONAL matrix driver example (disabled by default).
  # -------------------------------------------------------------------------
  # This job demonstrates fanning out multiple run indices from a single
  # dispatch. It is gated behind the RUN_MATRIX variable so the primary
  # workflow stays manual-dispatch friendly. To enable, define a workflow /
  # repository variable RUN_MATRIX=true. For a true 100-run experiment prefer
  # the external `gh workflow run` loop documented at the top of this file,
  # which yields one independent workflow run (and dataset) per index.
  matrix-driver-example:
    name: Matrix driver (example)
    if: vars.RUN_MATRIX == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        run_index: [1, 2, 3, 4, 5]
    steps:
      - name: Echo run index
        run: |
          echo "Would dispatch experiment run_index=${{ matrix.run_index }}"
          echo "batch=${EXPERIMENT_BATCH_ID} env=${TARGET_ENVIRONMENT}"
        shell: bash
