# Native/driver dependency build-script approvals (pnpm 11 `allowBuilds`).
#
# All set to `false`: their build scripts are intentionally NOT run. The metrics
# pipeline (tsx/esbuild) and the TypeScript build work from prebuilt binaries
# resolved via optional dependencies, and visual testing uses pixelmatch+pngjs
# (pure JS), so `pnpm install` stays deterministic across local and CI without a
# native toolchain. Set an entry to `true` (or run `pnpm approve-builds`) only
# when exercising real on-device mobile / on-browser execution.
allowBuilds:
  appium: false
  appium-ios-tuntap: false
  edgedriver: false
  esbuild: false
  geckodriver: false
  sharp: false
